name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    name: pr (${{ matrix.os }}, attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            attempt: 1
          - os: ubuntu-24.04
            attempt: 2
          - os: ubuntu-24.04
            attempt: 3
          - os: ubuntu-24.04
            attempt: 4
          - os: ubuntu-24.04
            attempt: 5
          - os: ubuntu-24.04
            attempt: 6
          - os: ubuntu-24.04
            attempt: 7
          - os: ubuntu-24.04
            attempt: 8
          - os: ubuntu-24.04
            attempt: 9
          - os: ubuntu-24.04
            attempt: 10
          - os: ubuntu-24.04
            attempt: 11
          - os: ubuntu-24.04
            attempt: 12
          - os: ubuntu-24.04
            attempt: 13
          - os: ubuntu-24.04
            attempt: 14
          - os: ubuntu-24.04
            attempt: 15
          - os: ubuntu-24.04
            attempt: 16
          - os: ubuntu-24.04
            attempt: 17
          - os: ubuntu-24.04
            attempt: 18
          - os: ubuntu-24.04
            attempt: 19
          - os: ubuntu-24.04
            attempt: 20
          - os: macos-15
            attempt: 1
          - os: windows-2025
            attempt: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run headless test
        shell: bash
        run: |
          set -o pipefail
          npm run e2e:headless 2>&1 | tee e2e.log
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Build static site
        run: node packages/build/src/build-static.js
        env:
          PATH_PREFIX: auto
      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rest-client-${{ matrix.os }}-${{ matrix.attempt }}
          path: e2e.log
          if-no-files-found: warn
